apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devops-app
  namespace: flask-test
  labels:
    app.kubernetes.io/name: flask-devops-app
    app.kubernetes.io/environment: test
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-devops-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-devops-app
        app.kubernetes.io/environment: test
    spec:
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: flask-devops-app
          image: ${REGISTRY_HOST}/${REGISTRY_NAMESPACE}/flask-devops-app:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: flask-devops-app
  namespace: flask-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flask-devops-app
  ports:
    - name: http
      port: 80
      targetPort: http
